name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs the full history

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        # The conventionalcommits preset is pinned to major 7: newer majors
        # require a conventional-changelog-writer that semantic-release's
        # release-notes-generator does not ship yet.
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits@7

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
