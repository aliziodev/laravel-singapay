name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'   # Laravel 13 requires PHP 8.3+

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        if: matrix.php == '8.4' && matrix.laravel == '13.*'
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        if: matrix.php == '8.4' && matrix.laravel == '13.*'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests with coverage gate
        if: matrix.php == '8.4' && matrix.laravel == '13.*'
        run: vendor/bin/pest --compact --coverage --min=80

      - name: Run tests
        if: matrix.php != '8.4' || matrix.laravel != '13.*'
        run: vendor/bin/pest --compact
