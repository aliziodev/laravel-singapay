name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan level 8)
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests with coverage gate
        if: matrix.php == '8.4'
        run: vendor/bin/pest --compact --coverage --min=80

      - name: Run tests
        if: matrix.php != '8.4'
        run: vendor/bin/pest --compact
